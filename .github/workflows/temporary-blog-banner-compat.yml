name: Temporary compatibility replacement for 2026-08-04 blog banners

on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - replace_legacy_blog_banners

permissions:
  contents: read

jobs:
  replace-legacy-media-files:
    runs-on: ubuntu-latest
    environment: hostinger
    timeout-minutes: 15
    steps:
      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Download dedicated horizontal blog banners
        run: |
          set -euo pipefail
          mkdir -p /tmp/together-blog-banners
          curl -fsSL https://togetherprivacy.tech/wp-content/uploads/2026/08/transparencia-em-ia-blog-banner.webp -o /tmp/together-blog-banners/transparencia-em-ia.webp
          curl -fsSL https://togetherprivacy.tech/wp-content/uploads/2026/08/ficha-tecnica-de-ia-blog-banner.webp -o /tmp/together-blog-banners/ficha-tecnica-de-ia.webp
          curl -fsSL https://togetherprivacy.tech/wp-content/uploads/2026/08/blockchain-e-lgpd-blog-banner.webp -o /tmp/together-blog-banners/blockchain-e-lgpd.webp
          curl -fsSL https://togetherprivacy.tech/wp-content/uploads/2026/08/passkeys-protecao-phishing-blog-banner.webp -o /tmp/together-blog-banners/passkeys-protecao-phishing.webp
          file /tmp/together-blog-banners/*.webp

      - name: Replace legacy portrait media binaries over FTP
        env:
          HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          host="${HOSTINGER_FTP_SERVER#ftp://}"
          host="${host#ftps://}"
          host="${host%%/*}"
          host="${host%%:*}"
          lftp -u "$HOSTINGER_FTP_USERNAME","$HOSTINGER_FTP_PASSWORD" "ftp://${host}:21" -e '
          set cmd:fail-exit yes
          set net:timeout 30
          set net:max-retries 3
          set ftp:passive-mode true
          set ftp:ssl-allow false
          cd .
          put /tmp/together-blog-banners/transparencia-em-ia.webp -o wp-content/uploads/2026/08/transparencia-em-ia.webp
          put /tmp/together-blog-banners/ficha-tecnica-de-ia.webp -o wp-content/uploads/2026/08/ficha-tecnica-de-ia.webp
          put /tmp/together-blog-banners/blockchain-e-lgpd.webp -o wp-content/uploads/2026/08/blockchain-e-lgpd.webp
          put /tmp/together-blog-banners/passkeys-protecao-phishing.webp -o wp-content/uploads/2026/08/passkeys-protecao-phishing.webp
          cls -l wp-content/uploads/2026/08/transparencia-em-ia.webp
          cls -l wp-content/uploads/2026/08/ficha-tecnica-de-ia.webp
          cls -l wp-content/uploads/2026/08/blockchain-e-lgpd.webp
          cls -l wp-content/uploads/2026/08/passkeys-protecao-phishing.webp
          bye
          '
