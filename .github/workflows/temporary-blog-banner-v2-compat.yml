name: Temporary v2 compatibility replacement for blog banners

on:
  repository_dispatch:
    types:
      - replace_legacy_blog_banners_v2

permissions:
  contents: read

jobs:
  replace-legacy-media-files:
    runs-on: ubuntu-latest
    environment: hostinger
    timeout-minutes: 15
    env:
      HOSTINGER_FTP_PROTOCOL: ftp
      HOSTINGER_FTP_PORT: 21
      HOSTINGER_FTP_SERVER_DIR: "."
    steps:
      - name: Replace legacy media filenames with content-specific v2 banners
        shell: bash
        env:
          HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import io
          import os
          import urllib.request
          from ftplib import FTP, FTP_TLS

          protocol = os.environ.get("HOSTINGER_FTP_PROTOCOL", "ftp").lower()
          port = int(os.environ.get("HOSTINGER_FTP_PORT", "21"))
          root = os.environ.get("HOSTINGER_FTP_SERVER_DIR", ".").rstrip("/") or "."

          def normalize_host(value):
              host = value.strip()
              if "://" in host:
                  host = host.split("://", 1)[1]
              host = host.split("/", 1)[0]
              if host.count(":") == 1:
                  host = host.rsplit(":", 1)[0]
              return host

          ftp_cls = FTP_TLS if protocol.startswith("ftps") else FTP
          ftp = ftp_cls(timeout=45)
          ftp.connect(normalize_host(os.environ["HOSTINGER_FTP_SERVER"]), port)
          ftp.login(os.environ["HOSTINGER_FTP_USERNAME"], os.environ["HOSTINGER_FTP_PASSWORD"])
          if isinstance(ftp, FTP_TLS):
              ftp.prot_p()
          ftp.voidcmd("TYPE I")

          slugs = [
              "transparencia-em-ia",
              "ficha-tecnica-de-ia",
              "blockchain-e-lgpd",
              "passkeys-protecao-phishing",
          ]
          base = "https://togetherprivacy.tech/wp-content/uploads/2026/08"
          remote_dir = f"{root}/wp-content/uploads/2026/08" if root != "." else "wp-content/uploads/2026/08"

          for slug in slugs:
              source_url = f"{base}/{slug}-blog-banner-v2.webp"
              request = urllib.request.Request(source_url, headers={"User-Agent": "Hermes banner compatibility"})
              with urllib.request.urlopen(request, timeout=45) as response:
                  data = response.read()
              expected = hashlib.sha256(data).hexdigest()
              for legacy_name in (f"{slug}-blog-banner.webp", f"{slug}.webp"):
                  remote_path = f"{remote_dir}/{legacy_name}"
                  ftp.storbinary(f"STOR {remote_path}", io.BytesIO(data))
                  restored = io.BytesIO()
                  ftp.retrbinary(f"RETR {remote_path}", restored.write)
                  actual = hashlib.sha256(restored.getvalue()).hexdigest()
                  if actual != expected:
                      raise RuntimeError(f"verification failed for {legacy_name}")
                  print(f"verified {legacy_name}: {len(data)} bytes")

          ftp.quit()
          print("all legacy banner filenames now contain v2 bytes")
          PY
