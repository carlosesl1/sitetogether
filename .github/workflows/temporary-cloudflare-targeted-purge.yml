name: Temporary targeted Cloudflare purge

on:
  repository_dispatch:
    types:
      - purge_together_blog_banner_urls

permissions:
  contents: read

jobs:
  purge-targeted-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_TOKEN_FALLBACK: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ZONE_ID_PRIMARY: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_ZONE_ID_FALLBACK: ${{ secrets.CF_ZONE_ID }}
    steps:
      - name: Purge only affected article and image URLs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ.get("CLOUDFLARE_API_TOKEN_PRIMARY") or os.environ.get("CLOUDFLARE_API_TOKEN_FALLBACK")
          zone = os.environ.get("CLOUDFLARE_ZONE_ID_PRIMARY") or os.environ.get("CLOUDFLARE_ZONE_ID_FALLBACK")
          if not token:
              print("cloudflare_token_configured=false")
              raise SystemExit(3)

          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "User-Agent": "Hermes targeted TOGETHER cache purge",
          }
          if not zone:
              request = urllib.request.Request("https://api.cloudflare.com/client/v4/zones?name=togetherprivacy.tech", headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              if not payload.get("success") or len(payload.get("result", [])) != 1:
                  print("cloudflare_zone_resolved=false")
                  raise SystemExit(4)
              zone = payload["result"][0]["id"]

          base = "https://togetherprivacy.tech"
          slugs = [
              "transparencia-em-ia",
              "ficha-tecnica-de-ia",
              "blockchain-e-lgpd",
              "passkeys-protecao-phishing",
          ]
          files = []
          for slug in slugs:
              files.extend([
                  f"{base}/blog/{slug}",
                  f"{base}/wp-content/uploads/2026/08/{slug}.webp",
                  f"{base}/wp-content/uploads/2026/08/{slug}-blog-banner.webp",
                  f"{base}/wp-content/uploads/2026/08/{slug}-blog-banner-v2.webp",
              ])

          request = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/zones/{zone}/purge_cache",
              data=json.dumps({"files": files}).encode(),
              headers=headers,
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=45) as response:
              payload = json.load(response)
          if not payload.get("success"):
              print("cloudflare_targeted_purge=false")
              raise SystemExit(5)
          print(f"cloudflare_targeted_purge=true urls={len(files)}")
          PY
